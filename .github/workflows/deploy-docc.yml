name: Deploy DocC Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  docs:
    uses: happitec-inc/shared-actions/.github/workflows/deploy-docc.yml@main
    with:
      target: DisplayControlCore
      hosting-base-path: displayctrl
      runner: ${{ vars.RUNNER_MACOS }}
      og-secondary-text: DisplayControlCore
      og-title: "DisplayControlCore — Documentation"
      og-description: "Programmatic display resolution, refresh rate management, and multi-monitor mirroring configuration on macOS."
    secrets:
      HAPPITEC_READ_ONLY_PAT: ${{ secrets.HAPPITEC_READ_ONLY_PAT }}
      GH_COMPUTER_APP_ID: ${{ secrets.GH_COMPUTER_APP_ID }}
      GH_COMPUTER_PRIVATE_KEY: ${{ secrets.GH_COMPUTER_PRIVATE_KEY }}
