name: Deploy DocC Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    uses: happitec-inc/public-actions/.github/workflows/deploy-docc.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      target: DisplayControlCore
      hosting-base-path: displayctrl
      runner: ${{ vars.RUNNER_MACOS || '["macos-26"]' }}
      og-title: "DisplayControlCore — Documentation"
      og-description: "Programmatic display resolution, refresh rate management, and multi-monitor mirroring configuration on macOS."
